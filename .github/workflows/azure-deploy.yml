name: Build and deploy Cursory to Azure App Service

# Two-stage pipeline mirrored on the MindAttic StreetSamurai deploy:
#   build   — restore + publish the Cursory.Blazor host as a deployable artifact
#   deploy  — push the artifact to the `cursory` App Service slot
#
# Requires: the Azure App Service `cursory` (.NET 10 runtime, WebSockets on), the repo secret
# `AZURE_WEBAPP_PUBLISH_PROFILE` (App Service → Get publish profile), and the enabled `cursory`
# entry in `MindAttic.Deploy/projects.json → apps[]`. All three exist; the App Service is
# currently stopped, so a successful deploy is not publicly reachable until it is started.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore Cursory.Blazor/Cursory.Blazor.csproj

      - name: Publish
        run: dotnet publish Cursory.Blazor/Cursory.Blazor.csproj -c Release -o publish --no-restore

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cursory-app
          path: publish/

  deploy:
    runs-on: windows-2025
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: cursory-app
          path: publish/

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: cursory
          slot-name: Production
          package: publish/
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
