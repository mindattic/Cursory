<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cooperative Drag Mechanic</title>
<style>
  :root {
    --bg: #f6f5f0;
    --surface: #ffffff;
    --border: rgba(0,0,0,0.12);
    --text: #1a1a1a;
    --text-muted: #5f5e5a;
    --radius-md: 8px;
    --radius-lg: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1rem;
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
  }
  .container { max-width: 720px; width: 100%; }
  h1 { font-size: 22px; font-weight: 500; margin: 0 0 0.5rem; }
  p { font-size: 14px; color: var(--text-muted); line-height: 1.6; margin: 0 0 1.5rem; }
  .controls {
    display: flex; gap: 12px; align-items: center;
    margin-bottom: 12px; flex-wrap: wrap;
  }
  button {
    padding: 6px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { background: #f0efe8; }
  label {
    font-size: 13px; color: var(--text-muted);
    display: flex; align-items: center; gap: 8px;
  }
  input[type="range"] { width: 140px; }
  .count { font-size: 13px; color: var(--text-muted); margin-left: auto; }
  .count strong { color: var(--text); font-weight: 500; }
  .stage {
    background: #eeede7;
    border-radius: var(--radius-lg);
    padding: 8px;
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    border-radius: var(--radius-md);
    background: var(--surface);
    cursor: crosshair;
  }
</style>
</head>
<body>
<div class="container">
  <h1>Cooperative drag mechanic</h1>
  <p>Click the block to attach a cursor at that point, then drag. Release and click again to add another cursor while the first stays in place. The block only moves when the summed force vector exceeds the friction threshold.</p>

  <div class="controls">
    <button id="reset-btn">Reset cursors</button>
    <label>
      Friction threshold
      <input type="range" id="threshold" min="0.3" max="3" step="0.1" value="1.2" />
      <span id="threshold-out" style="font-weight:500; min-width:28px;">1.2</span>
    </label>
    <span class="count">Cursors: <strong id="cursor-count">0</strong></span>
  </div>

  <div class="stage">
    <canvas id="game" width="640" height="380"></canvas>
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // --- Simulation state ---
  const block = { x: W/2, y: H/2, w: 70, h: 70, vx: 0, vy: 0, mass: 6 };
  let FRICTION = 1.2;        // static-friction threshold; net force must exceed this to move
  const SPRING_K = 0.025;    // spring stiffness per cursor
  const DAMP = 0.86;         // velocity damping per tick
  const GRAB_RADIUS = 14;    // px around a cursor head you can re-grab

  const colors = ['#7F77DD', '#1D9E75', '#D85A30', '#D4537E', '#378ADD', '#BA7517'];
  const cursors = [];        // { anchorLocalX, anchorLocalY, cursorX, cursorY, color }
  let dragging = null;

  // --- Controls ---
  document.getElementById('reset-btn').onclick = () => {
    cursors.length = 0;
    block.x = W/2; block.y = H/2; block.vx = 0; block.vy = 0;
    updateCount();
  };
  const thresh = document.getElementById('threshold');
  const threshOut = document.getElementById('threshold-out');
  thresh.oninput = () => {
    FRICTION = parseFloat(thresh.value);
    threshOut.textContent = FRICTION.toFixed(1);
  };

  function updateCount() {
    document.getElementById('cursor-count').textContent = cursors.length;
  }

  // --- Input ---
  function pos(e) {
    const r = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) * (W / r.width),
      y: (e.clientY - r.top) * (H / r.height)
    };
  }
  function onBlock(p) {
    return p.x > block.x - block.w/2 && p.x < block.x + block.w/2 &&
           p.y > block.y - block.h/2 && p.y < block.y + block.h/2;
  }

  canvas.addEventListener('mousedown', e => {
    const p = pos(e);
    // Re-grab an existing cursor if you click near its head
    for (const c of cursors) {
      const dx = p.x - c.cursorX, dy = p.y - c.cursorY;
      if (dx*dx + dy*dy < GRAB_RADIUS*GRAB_RADIUS) { dragging = c; return; }
    }
    // Otherwise attach a new cursor if you clicked the block
    if (onBlock(p)) {
      const c = {
        anchorLocalX: p.x - block.x,
        anchorLocalY: p.y - block.y,
        cursorX: p.x,
        cursorY: p.y,
        color: colors[cursors.length % colors.length]
      };
      cursors.push(c);
      dragging = c;
      updateCount();
    }
  });
  canvas.addEventListener('mousemove', e => {
    if (!dragging) return;
    const p = pos(e);
    dragging.cursorX = p.x;
    dragging.cursorY = p.y;
  });
  window.addEventListener('mouseup', () => { dragging = null; });

  // --- Physics tick ---
  function tick() {
    // Sum every attached cursor's spring force
    let fx = 0, fy = 0;
    for (const c of cursors) {
      const ax = block.x + c.anchorLocalX;  // anchor in world space
      const ay = block.y + c.anchorLocalY;
      fx += (c.cursorX - ax) * SPRING_K;
      fy += (c.cursorY - ay) * SPRING_K;
    }
    const fmag = Math.sqrt(fx*fx + fy*fy);

    // Only apply force above the friction threshold (Coulomb-ish static friction)
    if (fmag > FRICTION) {
      const eff = (fmag - FRICTION) / fmag;
      block.vx += (fx * eff) / block.mass;
      block.vy += (fy * eff) / block.mass;
    }
    block.vx *= DAMP;
    block.vy *= DAMP;
    block.x += block.vx;
    block.y += block.vy;

    // Walls
    if (block.x < block.w/2) { block.x = block.w/2; block.vx = 0; }
    if (block.x > W - block.w/2) { block.x = W - block.w/2; block.vx = 0; }
    if (block.y < block.h/2) { block.y = block.h/2; block.vy = 0; }
    if (block.y > H - block.h/2) { block.y = H - block.h/2; block.vy = 0; }

    render(fx, fy, fmag);
    requestAnimationFrame(tick);
  }

  // --- Rendering ---
  function drawCursor(x, y, angle, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.fillStyle = color;
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-20, -8);
    ctx.lineTo(-14, 0);
    ctx.lineTo(-20, 8);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  function render(fx, fy, fmag) {
    ctx.clearRect(0, 0, W, H);

    // Block (green = moving, gray = stuck)
    const moving = fmag > FRICTION;
    ctx.fillStyle = moving ? '#C0DD97' : '#D3D1C7';
    ctx.fillRect(block.x - block.w/2, block.y - block.h/2, block.w, block.h);
    ctx.strokeStyle = moving ? '#3B6D11' : '#5F5E5A';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(block.x - block.w/2, block.y - block.h/2, block.w, block.h);

    // Each cursor: dashed leash from anchor to cursor head, then arrow pointing back at anchor
    for (const c of cursors) {
      const ax = block.x + c.anchorLocalX;
      const ay = block.y + c.anchorLocalY;

      ctx.strokeStyle = c.color;
      ctx.globalAlpha = 0.45;
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 3]);
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.lineTo(c.cursorX, c.cursorY);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;

      ctx.fillStyle = c.color;
      ctx.beginPath();
      ctx.arc(ax, ay, 3.5, 0, Math.PI * 2);
      ctx.fill();

      // Cursor arrow always points inward toward its anchor
      const angle = Math.atan2(ay - c.cursorY, ax - c.cursorX);
      drawCursor(c.cursorX, c.cursorY, angle, c.color);
    }

    // Net force vector from block center
    if (fmag > 0.05) {
      const cx = block.x, cy = block.y;
      const scale = 18;
      ctx.strokeStyle = moving ? '#3B6D11' : '#A32D2D';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + fx * scale, cy + fy * scale);
      ctx.stroke();
      const ang = Math.atan2(fy, fx);
      ctx.save();
      ctx.translate(cx + fx * scale, cy + fy * scale);
      ctx.rotate(ang);
      ctx.fillStyle = moving ? '#3B6D11' : '#A32D2D';
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-8, -4);
      ctx.lineTo(-8, 4);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // HUD
    ctx.font = '12px system-ui, sans-serif';
    ctx.fillStyle = '#5F5E5A';
    ctx.fillText('Net force: ' + fmag.toFixed(2), 12, 20);
    ctx.fillStyle = moving ? '#3B6D11' : '#A32D2D';
    ctx.fillText(moving ? 'Moving' : 'Below threshold', 12, 36);
  }

  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
